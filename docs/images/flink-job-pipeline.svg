<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="920" viewBox="0 0 1800 920" role="img" aria-labelledby="title desc">
  <title id="title">Flink 风控作业内部处理链路</title>
  <desc id="desc">展示 OrderRiskJob 和 UserRiskJob 从 Kafka SQL Source、事件解析、Watermark、Keyed State、Timer、风险规则到 JDBC Sink 的处理过程。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="16" flood-color="#000000" flood-opacity="0.07"/></filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M1 1L10 5.5L1 10Z" fill="#86868b"/></marker>
    <style>.display{font:700 44px -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;fill:#1d1d1f}.lead{font:400 20px -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;fill:#6e6e73}.eyebrow{font:700 14px -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif}.laneTitle{font:700 25px -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;fill:#1d1d1f}.title{font:700 18px -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;fill:#1d1d1f}.body{font:400 14px -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;fill:#515154}.meta{font:500 13px -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;fill:#86868b}.line{fill:none;stroke:#86868b;stroke-width:3;stroke-linecap:round;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1800" height="920" fill="#f5f5f7"/>
  <text x="82" y="68" class="eyebrow" fill="#0071e3">FLINK PROCESSING MODEL</text>
  <text x="82" y="124" class="display">两个作业，两条独立状态链路</text>
  <text x="82" y="164" class="lead">SQL Source 定义输入合同，DataStream 负责事件时间、状态和复杂规则，JDBC 输出结构化告警。</text>

  <!-- White lane backgrounds. -->
  <g filter="url(#shadow)">
    <rect x="54" y="220" width="1692" height="260" rx="32" fill="#ffffff"/>
    <rect x="54" y="552" width="1692" height="260" rx="32" fill="#ffffff"/>
  </g>

  <!-- Connectors are above the lane backgrounds and below every step card. -->
  <path d="M454 348H484" class="line"/><path d="M694 348H724" class="line"/><path d="M934 348H964" class="line"/><path d="M1174 348H1204" class="line"/><path d="M1414 348H1444" class="line"/>
  <path d="M454 680H484" class="line"/><path d="M694 680H724" class="line"/><path d="M934 680H964" class="line"/><path d="M1174 680H1204" class="line"/><path d="M1414 680H1444" class="line"/>

  <!-- Labels and step cards. -->
  <g>
    <rect x="82" y="248" width="168" height="32" rx="16" fill="#e8f4ff"/><text x="166" y="269" text-anchor="middle" class="eyebrow" fill="#0071e3">ORDER RISK JOB</text>
    <text x="82" y="326" class="laneTitle">订单级风险</text><text x="82" y="362" class="body">keyBy(order_id)</text><text x="82" y="389" class="meta">状态 TTL：2 小时</text>

    <rect x="284" y="286" width="170" height="124" rx="22" fill="#f5f5f7"/><text x="308" y="324" class="title">Kafka SQL Source</text><text x="308" y="354" class="body">订单 / 明细 / 支付</text><text x="308" y="380" class="meta">3 个 Topic</text>
    <rect x="484" y="286" width="210" height="124" rx="22" fill="#f5f5f7"/><text x="508" y="324" class="title">解析与 Watermark</text><text x="508" y="354" class="body">严格 JSON 合同</text><text x="508" y="380" class="meta">乱序 2 分钟</text>
    <rect x="724" y="286" width="210" height="124" rx="22" fill="#f5f5f7"/><text x="748" y="324" class="title">Keyed State</text><text x="748" y="354" class="body">订单 / 明细 / 支付</text><text x="748" y="380" class="meta">event_id 去重</text>
    <rect x="964" y="286" width="210" height="124" rx="22" fill="#f5f5f7"/><text x="988" y="324" class="title">EventTime Timer</text><text x="988" y="354" class="body">支付成功后等待</text><text x="988" y="380" class="meta">2 分钟</text>
    <rect x="1204" y="286" width="210" height="124" rx="22" fill="#f5f5f7"/><text x="1228" y="324" class="title">风险规则</text><text x="1228" y="354" class="body">时序与金额一致性</text><text x="1228" y="380" class="meta">4 个风险项</text>
    <rect x="1444" y="286" width="260" height="124" rx="22" fill="#f5f5f7"/><text x="1468" y="324" class="title">JDBC Sink</text><text x="1468" y="354" class="body">rt_order_risk_alert</text><text x="1468" y="380" class="meta">稳定 alert_id Upsert</text>

    <rect x="82" y="580" width="158" height="32" rx="16" fill="#f3ecff"/><text x="161" y="601" text-anchor="middle" class="eyebrow" fill="#8944ab">USER RISK JOB</text>
    <text x="82" y="658" class="laneTitle">用户级风险</text><text x="82" y="694" class="body">keyBy(user_id)</text><text x="82" y="721" class="meta">状态 TTL：10 分钟</text>

    <rect x="284" y="618" width="170" height="124" rx="22" fill="#f5f5f7"/><text x="308" y="656" class="title">Kafka SQL Source</text><text x="308" y="686" class="body">订单 / 支付</text><text x="308" y="712" class="meta">2 个 Topic</text>
    <rect x="484" y="618" width="210" height="124" rx="22" fill="#f5f5f7"/><text x="508" y="656" class="title">解析与 Watermark</text><text x="508" y="686" class="body">事件时间分配</text><text x="508" y="712" class="meta">30 秒空闲检测</text>
    <rect x="724" y="618" width="210" height="124" rx="22" fill="#f5f5f7"/><text x="748" y="656" class="title">用户状态</text><text x="748" y="686" class="body">订单 / 支付 / 冷却</text><text x="748" y="712" class="meta">event_id 去重</text>
    <rect x="964" y="618" width="210" height="124" rx="22" fill="#f5f5f7"/><text x="988" y="656" class="title">滑动窗口 Timer</text><text x="988" y="686" class="body">60 秒 / 180 秒</text><text x="988" y="712" class="meta">10 秒滑动</text>
    <rect x="1204" y="618" width="210" height="124" rx="22" fill="#f5f5f7"/><text x="1228" y="656" class="title">风险规则</text><text x="1228" y="686" class="body">未支付与失败支付</text><text x="1228" y="712" class="meta">阈值 5 / 3</text>
    <rect x="1444" y="618" width="260" height="124" rx="22" fill="#f5f5f7"/><text x="1468" y="656" class="title">JDBC Sink</text><text x="1468" y="686" class="body">rt_user_risk_alert</text><text x="1468" y="712" class="meta">稳定 alert_id Upsert</text>
  </g>

  <rect x="54" y="852" width="1692" height="44" rx="18" fill="#ffffff"/>
  <text x="900" y="881" text-anchor="middle" class="body">默认并行度 3　·　独立消费组　·　独立状态　·　独立 Checkpoint 子目录　·　共享事件合同与解析工具</text>
</svg>
