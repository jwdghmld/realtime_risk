<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" viewBox="0 0 1800 1040" role="img" aria-labelledby="title desc">
  <title id="title">电商实时交易风控总体架构</title>
  <desc id="desc">Kafka 中的订单、明细和支付事件进入两个 Flink 作业，通过事件时间、状态和 Timer 检测风险，结果写入 MySQL realtime，并通过 HDFS Checkpoint 保存状态。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.075"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#0071e3"/></marker>
    <marker id="grayArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#86868b"/></marker>
    <style>.display{font:700 44px -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;fill:#1d1d1f}.lead{font:400 20px -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;fill:#6e6e73}.eyebrow{font:700 14px -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif}.title{font:700 23px -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;fill:#1d1d1f}.body{font:400 17px -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;fill:#515154}.meta{font:500 14px -apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;fill:#86868b}.line{fill:none;stroke:#0071e3;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.grayLine{fill:none;stroke:#86868b;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#grayArrow)}.dash{fill:none;stroke:#a1a1a6;stroke-width:2.5;stroke-dasharray:9 9;stroke-linecap:round;marker-end:url(#grayArrow)}</style>
  </defs>
  <rect width="1800" height="1040" fill="#f5f5f7"/>
  <text x="82" y="68" class="eyebrow" fill="#0071e3">REALTIME RISK PLATFORM</text>
  <text x="82" y="124" class="display">电商实时交易风控总体架构</text>
  <text x="82" y="164" class="lead">以事件时间处理跨 Topic 乱序，用状态、Timer 和稳定主键形成可恢复的风险检测链路。</text>

  <!-- Main connectors stay in whitespace and are rendered below the cards. -->
  <path d="M422 305H500" class="line"/><path d="M1000 305H1060" class="grayLine"/><path d="M1360 305H1420" class="grayLine"/>
  <path d="M760 400V438H970V470" class="line"/><path d="M850 400V452H1375V470" class="line"/>
  <path d="M1030 470V418H1160V385" class="grayLine"/>
  <path d="M1470 470V430H1260V385" class="grayLine"/>
  <path d="M970 700V830H1268" class="dash"/><path d="M1375 700V830H1268" class="dash"/>

  <g filter="url(#shadow)">
    <rect x="62" y="210" width="360" height="190" rx="28" fill="#ffffff"/>
    <circle cx="108" cy="255" r="21" fill="#fff0ef"/><path d="M98 255h20M108 245v20" stroke="#ff3b30" stroke-width="3" stroke-linecap="round"/>
    <text x="142" y="263" class="title">Kafka 交易 Topic</text>
    <text x="90" y="310" class="body">ods_order_info</text><text x="90" y="340" class="body">ods_order_detail</text><text x="90" y="370" class="body">ods_payment_info</text>
    <text x="316" y="310" text-anchor="end" class="meta">3 分区</text><text x="316" y="340" text-anchor="end" class="meta">2 副本</text><text x="316" y="370" text-anchor="end" class="meta">7 天保留</text>

    <rect x="500" y="210" width="500" height="190" rx="28" fill="#ffffff"/>
    <circle cx="546" cy="255" r="21" fill="#e8f4ff"/><path d="M535 258l8-8 7 6 10-13" fill="none" stroke="#0071e3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="580" y="263" class="title">Flink 公共处理能力</text>
    <text x="528" y="312" class="body">严格 JSON 解析与合同校验</text><text x="528" y="344" class="body">2 分钟 Watermark + 30 秒空闲检测</text><text x="528" y="376" class="meta">event_id 去重 · 状态 TTL · EventTime Timer</text>

    <rect x="1060" y="225" width="300" height="160" rx="28" fill="#ffffff"/>
    <circle cx="1106" cy="270" r="21" fill="#fff4e5"/><ellipse cx="1106" cy="265" rx="11" ry="5" fill="none" stroke="#ff9f0a" stroke-width="2.5"/><path d="M1095 265v13c0 3 5 5 11 5s11-2 11-5v-13" fill="none" stroke="#ff9f0a" stroke-width="2.5"/>
    <text x="1140" y="278" class="title">MySQL realtime</text>
    <text x="1088" y="326" class="body">两张结构化告警表</text><text x="1088" y="354" class="meta">稳定 alert_id 主键 Upsert</text>
  </g>

  <text x="62" y="446" class="eyebrow" fill="#0071e3">INDEPENDENT FLINK JOBS</text>

  <g filter="url(#shadow)">
    <rect x="62" y="470" width="1063" height="230" rx="30" fill="#ffffff"/>
    <rect x="90" y="498" width="158" height="32" rx="16" fill="#e8f4ff"/><text x="169" y="519" text-anchor="middle" class="eyebrow" fill="#0071e3">ORDER RISK</text>
    <text x="90" y="574" class="title">OrderRiskJob</text>
    <text x="90" y="615" class="body">订单、明细和支付按 order_id 归并，成功支付到达后等待 2 分钟再统一判断。</text>
    <text x="90" y="658" class="meta">订单不存在 · 支付早于下单 · 明细金额不一致 · 支付金额不一致</text>
    <rect x="785" y="510" width="300" height="150" rx="22" fill="#f5f5f7"/>
    <text x="815" y="550" class="body">消费组</text><text x="1039" y="550" text-anchor="end" class="meta">order-risk</text>
    <text x="815" y="590" class="body">Keyed State TTL</text><text x="1039" y="590" text-anchor="end" class="meta">2 小时</text>
    <text x="815" y="630" class="body">默认并行度</text><text x="1039" y="630" text-anchor="end" class="meta">3</text>

    <rect x="1220" y="470" width="512" height="230" rx="30" fill="#ffffff"/>
    <rect x="1248" y="498" width="146" height="32" rx="16" fill="#f3ecff"/><text x="1321" y="519" text-anchor="middle" class="eyebrow" fill="#8944ab">USER RISK</text>
    <text x="1248" y="574" class="title">UserRiskJob</text>
    <text x="1248" y="615" class="body">订单和支付按 user_id 归并，使用滑动窗口 Timer 评估用户短周期风险。</text>
    <text x="1248" y="658" class="meta">60 秒高频未支付 · 180 秒连续支付失败</text>

    <rect x="1268" y="760" width="464" height="150" rx="28" fill="#ffffff"/>
    <circle cx="1314" cy="805" r="21" fill="#f2f2f7"/><path d="M1304 805h20M1314 795v20" stroke="#86868b" stroke-width="3" stroke-linecap="round"/>
    <text x="1348" y="813" class="title">HDFS Checkpoint</text>
    <text x="1296" y="856" class="body">两个作业使用独立状态目录</text><text x="1296" y="884" class="meta">取消时保留外部化 Checkpoint</text>

    <rect x="62" y="760" width="1063" height="200" rx="30" fill="#ffffff"/>
    <text x="90" y="806" class="eyebrow" fill="#0071e3">CONSISTENCY &amp; RECOVERY</text>
    <text x="90" y="852" class="body">每 60 秒保存 Kafka offset、算子状态和 Timer；故障时固定延迟重启 3 次，每次间隔 30 秒。</text>
    <text x="90" y="894" class="body">Kafka 到 Flink 状态具备 Exactly-Once 恢复语义；JDBC Sink 使用稳定主键幂等收敛。</text>
    <text x="90" y="930" class="meta">JDBC Sink 不使用 XA 两阶段提交，因此不宣称 Kafka → MySQL 严格端到端 Exactly-Once。</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1420" y="225" width="312" height="160" rx="28" fill="#ffffff"/>
    <circle cx="1466" cy="270" r="21" fill="#eaf8ef"/>
    <path d="M1456 273l7 7 14-18" fill="none" stroke="#34c759" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1500" y="278" class="eyebrow" fill="#248a3d">RESULT</text>
    <text x="1448" y="326" class="body">告警结果查询</text>
    <text x="1448" y="354" class="meta">轻量展示与规则核验</text>
  </g>
</svg>
